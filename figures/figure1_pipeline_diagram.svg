<text x="1850" y="790" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#111111">B  Screen string matching</text>
<text x="1850" y="828" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#111111">C  Screen-aware aliases</text>
<text x="1850" y="866" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#111111">Inputs: ASR transcript</text>
<text x="1850" y="904" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#111111">+ visible screen lexicon</text>
<rect x="2160" y="700" width="390" height="210" rx="8" fill="#D9F0E8" stroke="#222222" stroke-width="3"/>
<text x="2355" y="752" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#111111">Corrected grounding</text>
<text x="2355" y="802" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#111111">Inputs: screenshot</text>
<text x="2355" y="839" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#111111">+ corrected transcript</text>
<text x="2355" y="876" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#111111">Same G1/G2 settings</text>
