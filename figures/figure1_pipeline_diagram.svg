<text x="1550" y="1132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111111">Transcript evaluation</text>
<text x="1550" y="1182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#111111">ASR: CER, Thai-tokenized WER, loanword error</text>
<text x="1550" y="1222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#111111">Correction: recovery rate and false correction rate</text>
<text x="1550" y="1262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#111111">Computed directly from transcript records</text>
<rect x="2580" y="390" width="360" height="410" rx="8" fill="#F6DED8" stroke="#222222" stroke-width="3"/>
<text x="2760" y="442" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#111111">Grounding evaluation</text>
<text x="2760" y="492" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#111111">Raw click accuracy</text>
<text x="2760" y="528" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#111111">Corrected-run accuracy</text>
<text x="2760" y="564" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#111111">Changed vs unchanged</text>
<text x="2760" y="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#111111">Parse/bounds failures</text>
<text x="2760" y="636" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#111111">kept in denominator</text>
<text x="75" y="190" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#526D82">DATA AND SPEECH PIPELINE</text>
<text x="1620" y="170" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2F6B9A">RAW ASR PATH</text>
<text x="1580" y="625" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#9A6700">FIXED CORRECTION PATH</text>
<rect x="2110" y="1080" width="830" height="300" rx="8" fill="#F3F5F7" stroke="#68727D" stroke-width="3" stroke-dasharray="10 8"/>
<text x="2525" y="1135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#111111">Interpretation limitation</text>
<text x="2525" y="1185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#111111">Raw and corrected grounding are</text>
<text x="2525" y="1222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#111111">independent inference runs.</text>
<text x="2525" y="1265" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#111111">Unchanged prompts quantify rerun variability.</text>
<text x="2525" y="1302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#111111">Pooled differences are not purely causal effects.</text>
<text x="60" y="1450" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#444444">Grounding input: screenshot + transcript only. Target IDs, target boxes, and gold answers are never provided.</text>
