<text x="1390" y="322" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#111111">Whisper large-v3</text>
<text x="1390" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#111111">Typhoon ASR</text>
